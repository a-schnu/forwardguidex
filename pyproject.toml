[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forwardguidex"
version = "0.1.0"
description = "ForwardGuidex - personal market-intelligence warehouse"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Antonino Mustazza" }]
dependencies = [
    "duckdb>=0.10",
    "pandas>=2.0",
    "yfinance>=0.2.40",
    # yfinance's get_earnings_dates() parses HTML with lxml but doesn't hard-depend
    # on it; declare it so the earnings ingest works in a clean CI install.
    "lxml>=4.9",
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "jsonschema[format-nongpl]>=4.20",
    "pandas-market-calendars>=4.4",
]

[project.optional-dependencies]
# Firestore create-only archive (CI GCP-auth job only). Heavy (grpc/google-cloud);
# publish.py imports it lazily so the rest of the package works without it.
publish = ["firebase-admin>=6.5"]
# Legacy Streamlit dev dashboard (superseded by the static app/ build).
dashboard = ["streamlit>=1.33", "plotly>=5.20"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
fwdx = "forwardguidex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forwardguidex = ["serve/snapshot_schema.json"]

[tool.ruff]
line-length = 100

# Explicit rule selection: ruff's *default* set changes between releases, so
# relying on it means a routine `ruff` bump can turn a green branch red (or,
# worse, silently stop enforcing something). `forwardguidex-ci` gates on this.
[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # flake8-bugbear — real bug patterns, not style
    "BLE",      # blind `except Exception` — allowed, but each one must justify itself
    "S",        # flake8-bandit — this pipeline holds API tokens and deploys prod
    "RUF",      # ruff-specific
]
ignore = [
    # Long lines are tolerated: most offenders are dense literal tables and
    # explanatory comments where wrapping hurts readability. `line-length` above
    # still applies to anything auto-formatted.
    "E501",
]
# TODO: enable "DTZ" (naive datetime). It currently flags 6 real ambiguities in
# rates.py / brief.py / rights.py where a *business date* is derived from
# `date.today()`; each needs a deliberate decision about which timezone defines
# the trading day, so it is tracked separately rather than papered over.

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to assert, and to hardcode throwaway credentials in fixtures.
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
