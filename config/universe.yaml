# Standalone ETFs (role "fund") — surfaced as the snapshot's top-level `etfs` block.
# Primary listings are the EUR-denominated European lines; US-listed fallbacks
# (RSP/IEMG/FEZ/VT, all USD) are noted in comments should a primary lack history.
etfs:
  - {ticker: "XDEW.DE", name: "Xtrackers S&P 500 Equal Weight", ccy: "EUR"}   # fallback: RSP (USD)
  - {ticker: "XMME.DE", name: "Xtrackers MSCI EM (acc)",        ccy: "EUR"}   # fallback: IEMG (USD)
  - {ticker: "SXRT.DE", name: "iShares Core Euro Stoxx 50",     ccy: "EUR"}   # fallback: FEZ (USD)
  - {ticker: "VWCE.DE", name: "Vanguard FTSE All-World (acc)",  ccy: "EUR"}   # fallback: VT (USD)
  - {ticker: "ILF",     name: "iShares Latin America 40"}                     # USD
  # Highest-AUM US-listed ETFs (USD)
  - {ticker: "SPY", name: "SPDR S&P 500"}
  - {ticker: "QQQ", name: "Invesco QQQ (Nasdaq 100)"}
  - {ticker: "VTI", name: "Vanguard Total Stock Market"}
  - {ticker: "IWM", name: "iShares Russell 2000"}
  - {ticker: "GLD", name: "SPDR Gold Shares"}
  - {ticker: "SLV", name: "iShares Silver Trust"}
  - {ticker: "TLT", name: "iShares 20+ Year Treasury Bond"}
  - {ticker: "HYG", name: "iShares iBoxx $ High Yield Corp Bond"}
  - {ticker: "LQD", name: "iShares iBoxx $ Inv Grade Corp Bond"}
  - {ticker: "AGG", name: "iShares Core U.S. Aggregate Bond"}
  - {ticker: "EEM", name: "iShares MSCI Emerging Markets"}
  - {ticker: "EFA", name: "iShares MSCI EAFE"}

# Major crypto assets (role "crypto") via yfinance — surfaced as the snapshot's
# top-level `crypto` block. Quoted in USD.
crypto:
  - {ticker: "BTC-USD", name: "Bitcoin",  ccy: "USD"}
  - {ticker: "ETH-USD", name: "Ethereum", ccy: "USD"}
  - {ticker: "SOL-USD", name: "Solana",   ccy: "USD"}
  - {ticker: "XRP-USD", name: "XRP",      ccy: "USD"}
  - {ticker: "BNB-USD", name: "BNB",      ccy: "USD"}

# EUR crosses (role "fx"; never rendered). Each ticker EUR{CUR}=X quotes units of
# CUR per 1 EUR — used to convert every price item's `last` into a EUR value.
fx_eur:
  - "EURUSD=X"
  - "EURGBP=X"
  - "EURJPY=X"
  - "EURHKD=X"
  - "EURCNY=X"
  - "EURKRW=X"

