# ForwardGuidex — investment universe & data-source config
# Edit freely: add tickers, Treasury maturities, NY Fed / BIS rates, or GDELT queries.
# Rates come from primary sources (US Treasury + NY Fed) and the BIS central-bank
# policy-rate statistics — FRED was removed for compliance (its terms conflict with
# persistence + LLM use). See config/sources.yaml.
#
# Every price entry may be a bare ticker string OR a mapping {ticker, name, ccy}.
# `ccy` defaults to "USD" and `name` to null. Currencies are controlled here (never
# taken from yfinance) so the snapshot currency enum can never be surprised.

indexes:
  # US
  - {ticker: "^GSPC", name: "S&P 500"}
  - {ticker: "^DJI",  name: "Dow Jones"}
  - {ticker: "^NDX",  name: "Nasdaq 100"}
  - {ticker: "^RUT",  name: "Russell 2000"}
  # Europe
  - {ticker: "^STOXX",     name: "STOXX Europe 600", ccy: "EUR"}
  - {ticker: "^STOXX50E",  name: "Euro Stoxx 50",    ccy: "EUR"}
  - {ticker: "^GDAXI",     name: "DAX",              ccy: "EUR"}
  - {ticker: "^FCHI",      name: "CAC 40",           ccy: "EUR"}
  - {ticker: "^FTSE",      name: "FTSE 100",         ccy: "GBP"}
  - {ticker: "FTSEMIB.MI", name: "FTSE MIB",         ccy: "EUR"}
  # Asia
  - {ticker: "^N225",      name: "Nikkei 225",          ccy: "JPY"}
  - {ticker: "^HSI",       name: "Hang Seng",           ccy: "HKD"}
  - {ticker: "000001.SS",  name: "Shanghai Composite",  ccy: "CNY"}
  - {ticker: "^KS11",      name: "KOSPI",               ccy: "KRW"}

