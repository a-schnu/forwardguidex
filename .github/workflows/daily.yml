name: forwardguidex-daily

# Full daily pipeline: ingest -> marts -> brief -> Telegram (fwdx run-daily,
# app-scoped) -> export the prod snapshot from the warehouse -> validate
# (fail-closed) -> Cloudflare Pages Direct Upload of app/ -> authenticated
# smoke test against the UNIQUE deployment URL -> (separate GCP-auth/WIF job)
# archive to Firestore (create-only) -> release the shared production lock.
#
# Shares a single `production` release lock with deploy-app.yml (see
# `concurrency` below): the two workflows use the SAME group name, so a
# code-only deploy and a daily data refresh can never race each other's
# Cloudflare Pages deploy or Firestore archive write.

on:
  schedule:
    - cron: "30 11 * * 1-5" # 11:30 UTC on weekdays (pre US open)
  workflow_dispatch:
    inputs:
      allow_bootstrap:
        description: "Allow deploy without a prior successful deployment (rollback target). Only for the very first production deploy."
        required: false
        type: boolean
        default: false

# Least privilege by default; `id-token: write` is granted ONLY on the
# `publish` job below (the one GCP/WIF-auth job in this workflow).
permissions:
  contents: read

# Shared across BOTH workflows (this file and deploy-app.yml) — same group
# name. Held for the whole run (build -> validate -> deploy -> smoke ->
# rollback/success -> archive), not released early.
concurrency:
  group: forwardguidex-production-deployment
  cancel-in-progress: false

env:
  CF_PROJECT_NAME: fgx-dashboard
  # Set repo variable APP_HOST to your live dashboard URL (e.g. the exact
  # fgx-dashboard.pages.dev subdomain, or https://app.forwardguidex.com once the
  # custom domain is added). Falls back to the default pages.dev name.
  APP_HOST: ${{ vars.APP_HOST || 'https://fgx-dashboard.pages.dev' }}

jobs:
  # ---------------------------------------------------------------------
  # Job 1 — run the pipeline, export + validate the snapshot, deploy,
  # smoke test, rollback on failure.
  # ---------------------------------------------------------------------
  build-validate-deploy:
    name: run-daily -> export -> validate -> deploy -> smoke
    runs-on: ubuntu-latest
    environment: production
    # Bounded job budget: data pull + build + deploy + smoke normally finishes
    # in ~15 min; the GitHub-default 6h timeout would mask a stuck provider
    # (P1.4). Keep enough margin for a slow smoke retry.
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_sha256: ${{ steps.export.outputs.artifact_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # P1.5: no git credentials persisted into the runner env (we never
          # push from CI). fetch-depth:1 is enough for `git rev-parse HEAD`.
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install forwardguidex (core, hash-pinned)
        # P1.2: hash-pinned, wheel-only install. `pip install -e .` resolved open
        # ranges (pandas>=2.0, duckdb>=0.10, yfinance>=0.2.40) fresh on every run,
        # so a compromised or simply broken upstream release landed straight in
        # production with no review. requirements/*.lock are generated by
        # scripts/lock-deps.sh for cp311 / manylinux — the exact CI target.
        run: |
          set -euo pipefail
          pip install --require-hashes --only-binary=:all: -r requirements/core.lock
          pip install --no-deps -e .
          pip check

      - name: Daily run (ingest all -> marts -> brief -> Telegram)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # FRED was decommissioned (compliance) — no FRED_API_KEY here; see
          # `fwdx decommission-fred` and legal/us-treasury.txt +
          # legal/nyfed-reference-rates.txt for the replacement sources.
        run: fwdx run-daily

      - name: Export the prod snapshot from the warehouse
        id: export
        run: |
          set -euo pipefail
          fwdx export --out-dir dist
          ls -la dist/
          SNAP=$(ls dist/snapshot.*.json | head -n1)
          ARTIFACT_SHA256=$(python3 -c "import json,sys; print(json.load(open('dist/latest.json'))['artifact_sha256'])")
          echo "snapshot_path=$SNAP" >> "$GITHUB_OUTPUT"
          echo "snapshot_name=$(basename $SNAP)" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$ARTIFACT_SHA256" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT_SHA256=$ARTIFACT_SHA256" >> "$GITHUB_ENV"

      - name: Validate the candidate snapshot (fail-closed)
        run: |
          set -euo pipefail
          fwdx validate "${{ steps.export.outputs.snapshot_path }}"

      - name: Stage validated snapshot into app/data/ (prod files alongside demo files)
        run: |
          set -euo pipefail
          cp dist/snapshot.*.json dist/latest.json app/data/
          ls -la app/data/

      # -----------------------------------------------------------------
      # P0.3 — Capture the pre-deploy rollback target.
      #
      # Fail-closed lookup: bounded retries, curl --fail on HTTP errors,
      # strict JSON shape validation. Empty result is only tolerated when
      # workflow_dispatch.allow_bootstrap is true (documented bootstrap
      # for the very first prod deploy).
      # -----------------------------------------------------------------
      - name: Capture current live deployment (pre-deploy, for rollback target)
        id: pre
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALLOW_BOOTSTRAP: ${{ github.event.inputs.allow_bootstrap || 'false' }}
        run: |
          set -euo pipefail
          resp_file=$(mktemp)
          # Retries only for transient 5xx/network; --fail-with-body makes
          # curl exit non-zero for any 4xx/5xx while still saving the body.
          curl -sS --fail-with-body \
               --retry 3 --retry-delay 4 --retry-connrefused \
               --retry-all-errors \
               --connect-timeout 10 --max-time 45 \
               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
               -o "$resp_file" \
               "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}/deployments?per_page=25"
          python3 - "$resp_file" <<-'PYEOF'
          	import json
          	import os
          	import re
          	import sys
          	path = sys.argv[1]
          	try:
          	    body = json.load(open(path, encoding="utf-8"))
          	except Exception as e:  # noqa: BLE001
          	    sys.exit(f"::error::rollback lookup: unparseable JSON from Cloudflare API ({e}).")
          	if not isinstance(body, dict) or body.get("success") is not True:
          	    errs = body.get("errors") if isinstance(body, dict) else None
          	    sys.exit(f"::error::rollback lookup: Cloudflare API success!=true ({errs}).")
          	result = body.get("result")
          	if not isinstance(result, list):
          	    sys.exit("::error::rollback lookup: response.result is not an array.")
          	prev_id = ""
          	id_pat = re.compile(r"^[0-9a-fA-F-]{8,64}$")
          	for d in result:
          	    if not isinstance(d, dict):
          	        continue
          	    if d.get("environment") != "production":
          	        continue
          	    stage = (d.get("latest_stage") or {}).get("status")
          	    if stage != "success":
          	        continue
          	    did = d.get("id") or ""
          	    if not id_pat.match(did):
          	        continue
          	    prev_id = did
          	    break
          	if not prev_id:
          	    if os.environ.get("ALLOW_BOOTSTRAP", "").lower() == "true":
          	        print("::warning::rollback lookup: no previous successful production deployment; bootstrap explicitly allowed.")
          	    else:
          	        sys.exit("::error::rollback lookup: no previous successful production deployment found. Re-run with workflow_dispatch input allow_bootstrap=true only for the first deploy.")
          	with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
          	    f.write(f"deployment_id={prev_id}\n")
          	print(f"Previous successful production deployment: {prev_id or 'none (bootstrap)'}")
          	PYEOF

      # -----------------------------------------------------------------
      # Deploy to Cloudflare Pages Direct Upload.
      # -----------------------------------------------------------------
      - name: Deploy app/ to Cloudflare Pages (Direct Upload)
        id: deploy_cf
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app --project-name=fgx-dashboard --branch=main

      # -----------------------------------------------------------------
      # P0.2 — Fail-closed smoke test.
      #
      # Runs against the UNIQUE deployment URL first (`steps.deploy_cf`
      # output `deployment-url`) to bypass cache/alias propagation, then
      # the stable APP_HOST. Every mandatory probe is one of PASS / FAIL /
      # INCONCLUSIVE and INCONCLUSIVE fails the gate (rollback).
      #
      # Contract:
      #   * unauth GET /                    -> exactly 401 + WWW-Authenticate
      #   * auth GET / (correct pwd)        -> 200
      #   * auth GET / (wrong pwd)          -> 401
      #   * live /data/latest.json          -> valid JSON, expected snapshot filename
      #   * live SHA-256 of served snapshot -> matches export's artifact_sha256
      #   * unauth POST /api/chat           -> 401 (middleware gate)
      #   * auth GET /api/chat              -> 405
      #   * auth POST /api/chat malformed   -> 400
      #   * cross-origin POST /api/chat     -> 403 (with correct auth)
      # -----------------------------------------------------------------
      - name: Verify deployment (live bytes + auth gate + /api/chat)
        id: smoke
        continue-on-error: true
        env:
          APP_HOST: ${{ env.APP_HOST }}
          UNIQUE_DEPLOY_URL: ${{ steps.deploy_cf.outputs.deployment-url }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          EXPECTED_ARTIFACT_SHA256: ${{ steps.export.outputs.artifact_sha256 }}
          EXPECTED_SNAPSHOT_NAME: ${{ steps.export.outputs.snapshot_name }}
        run: |
          set -euo pipefail
          python3 .github/workflows/smoke.py 2>&1 | tee smoke-test.log

      - name: Upload smoke test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-test-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: smoke-test.log
          retention-days: 30
          if-no-files-found: warn

      # --- Rollback path (smoke failed) ---------------------------------
      # NOTE: if smoke fails and we roll back, the `publish` job below is
      # skipped entirely (it `needs: build-validate-deploy`, which will be
      # in a failed state) — the just-generated snapshot is never archived,
      # matching "deploy != archive" and "archive-fail/skip is not a
      # rollback trigger, but a failed deploy must never be archived".
      - name: Rollback to previous successful deployment (smoke failed)
        if: always() && steps.smoke.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREV_DEPLOYMENT_ID: ${{ steps.pre.outputs.deployment_id }}
        run: |
          set -euo pipefail
          if [ -z "${PREV_DEPLOYMENT_ID:-}" ]; then
            echo "::error::Smoke failed but no previous successful deployment exists (bootstrap-run). Manual intervention required."
            exit 1
          fi
          echo "Rolling back Cloudflare Pages project fgx-dashboard to deployment $PREV_DEPLOYMENT_ID"
          curl -sS --fail-with-body \
               --retry 3 --retry-delay 4 --retry-connrefused --retry-all-errors \
               --connect-timeout 10 --max-time 60 \
               -X POST \
               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
               -H "Content-Type: application/json" \
               "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/fgx-dashboard/deployments/${PREV_DEPLOYMENT_ID}/rollback" \
               -o rollback-response.json
          python3 -c "import json,sys; b=json.load(open('rollback-response.json')); sys.exit(0 if b.get('success') is True else 1)"

      - name: Verify rollback (re-run auth + hash checks against stable alias)
        if: always() && steps.smoke.outcome == 'failure'
        env:
          APP_HOST: ${{ env.APP_HOST }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<-'PYEOF'
          	import base64
          	import hashlib
          	import json
          	import os
          	import sys
          	import time
          	import urllib.error
          	import urllib.request

          	host = os.environ["APP_HOST"].rstrip("/")
          	headers = {
          	    "Authorization": "Basic " + base64.b64encode(("ci:" + os.environ["DASHBOARD_PASSWORD"]).encode()).decode(),
          	    "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
          	    "Cache-Control": "no-cache",
          	}
          	cache_bust = f"?_smoke_rollback={int(time.time())}"

          	def fetch(path):
          	    req = urllib.request.Request(host + path + cache_bust, headers=headers)
          	    try:
          	        with urllib.request.urlopen(req, timeout=30) as resp:
          	            return resp.status, resp.read()
          	    except urllib.error.HTTPError as e:
          	        return e.code, e.read()

          	status, _ = fetch("/")
          	if status != 200:
          	    sys.exit(f"::error::Post-rollback GET / -> HTTP {status}. Rollback did not restore service.")

          	status, body = fetch("/data/latest.json")
          	if status != 200:
          	    sys.exit(f"::error::Post-rollback GET /data/latest.json -> HTTP {status}.")
          	manifest = json.loads(body)

          	status, snap_body = fetch(f"/data/{manifest['snapshot']}")
          	if status != 200 or hashlib.sha256(snap_body).hexdigest() != manifest["artifact_sha256"]:
          	    sys.exit("::error::Post-rollback snapshot hash verification failed.")

          	print("OK: rollback verified — previous deployment is live and internally consistent.")
          	PYEOF

      - name: Alert — smoke test failed, rollback performed
        if: always() && steps.smoke.outcome == 'failure'
        run: |
          echo "::error::Daily deploy smoke test FAILED for ${APP_HOST}. Rolled back to the previous successful Cloudflare Pages deployment (id: ${{ steps.pre.outputs.deployment_id }}). The freshly built snapshot was NOT archived to Firestore (publish job is skipped when this job fails). See the smoke-test-log-${{ github.run_id }}-${{ github.run_attempt }} artifact for details. This job is intentionally failing so GitHub surfaces a run failure as the alert; wire a dedicated channel (Slack/email/PagerDuty webhook) here if stronger paging is needed."
          exit 1

      - name: Upload validated snapshot for the publish job
        if: steps.smoke.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-snapshot
          path: |
            dist/snapshot.*.json
            dist/latest.json
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Job 2 — archive the deployed, smoke-tested snapshot to Firestore
  # (create-only, idempotent) via a separate GCP-auth (WIF) job. Only runs
  # if build-validate-deploy succeeded (i.e. smoke passed) — a rolled-back
  # deploy is never archived.
  # ---------------------------------------------------------------------
  publish:
    name: Archive smoke-tested snapshot to Firestore (WIF, create-only)
    needs: build-validate-deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # ONLY this job needs id-token:write, for WIF -> GCP.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install forwardguidex (core + publish extra, hash-pinned)
        # P1.2: hash-pinned, wheel-only install. `pip install -e .` resolved open
        # ranges (pandas>=2.0, duckdb>=0.10, yfinance>=0.2.40) fresh on every run,
        # so a compromised or simply broken upstream release landed straight in
        # production with no review. requirements/*.lock are generated by
        # scripts/lock-deps.sh for cp311 / manylinux — the exact CI target.
        run: |
          set -euo pipefail
          pip install --require-hashes --only-binary=:all: -r requirements/publish.lock
          pip install --no-deps -e .
          pip check

      - name: Download validated snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-snapshot
          path: dist/

      - name: Authenticate to GCP (WIF, writer service account)
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_WRITER_SA }}

      - name: Publish (archive) to Firestore snapshots_history (create-only)
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SNAP=$(ls dist/snapshot.*.json | head -n1)
          fwdx publish "$SNAP" --manifest dist/latest.json
